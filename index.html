<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support Farin YT</title>
 <style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden; /* 🔒 KUNCI SCROLL */
}

body {
  height: 100vh;
  background:
    radial-gradient(800px circle at top left, #1a1144, transparent 40%),
    radial-gradient(800px circle at bottom right, #003f44, transparent 45%),
    #06070c;
  color: #f1f1f6;
}

/* CENTER */
.container {
  height: 100vh;              /* ❗ FIX */
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

/* BADGE */
.badge {
  display: inline-block;
  padding: 6px 14px;
  font-size: 11px;
  letter-spacing: 1px;
  border-radius: 999px;
  background: rgba(255,255,255,0.08);
  margin-bottom: 18px;
}

/* TITLE */
h1 {
  font-size: 36px;
  line-height: 1.15;
  margin-bottom: 12px;
}

h1 span {
  color: #5fd6ff;
}

/* SUBTITLE */
.subtitle {
  font-size: 14.5px;
  line-height: 1.7;
  color: #c9cbe0;
  margin-bottom: 22px;
}

/* STATS */
.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 22px;
}

.stat {
  padding: 14px 10px;
  border-radius: 14px;
  background: rgba(255,255,255,0.06);
  text-align: center;
}

.stat strong {
  display: block;
  font-size: 16px;
}

.stat small {
  font-size: 12px;
  color: #aeb1d6;
}

/* ACTIONS */
.actions {
  display: flex;
  gap: 14px;
}

.btn-support {
  flex: 1;
  padding: 14px 0;
  border-radius: 999px;
  border: none;
  cursor: pointer;
  font-size: 14.5px;
  font-weight: 600;
  color: #0c1020;
  background: linear-gradient(90deg, #5b7cff, #6ddcff);
}

.btn-follow {
  flex: 1;
  padding: 13px 0;
  border-radius: 999px;
  text-align: center;
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
  color: #6ddcff;
  border: 1px solid rgba(109,220,255,0.45);
  background: transparent;
}

/* DESKTOP STABLE */
@media (min-width: 768px) {
  .content {
    max-width: 700px;
  }

  h1 {
    font-size: 46px;
  }

  .subtitle {
    font-size: 16px;
  }

  .stats {
    grid-template-columns: repeat(3, 1fr);
  }
}

@media (min-width: 1200px) {
  .content {
    max-width: 900px;
  }
}

.content {
  width: 100%;
  max-width: 420px;
}

.footer {
  position: fixed;        /* 🔥 BUKAN absolute */
  bottom: 14px;
  left: 0;
  width: 100%;
  text-align: center;
  font-size: 12px;
  color: rgba(255,255,255,0.5);
  letter-spacing: .3px;
  pointer-events: none;
}
</style>
</head>
<body>

<main class="container">
  <section class="content">

    <span class="badge">OFFICIAL CREATOR PAGE</span>

    <h1>
      Support<br>
      <span>Farin Yt</span>
    </h1>

    <p class="subtitle">
      Setiap dukungan membantu saya terus berkarya,
      meningkatkan kualitas konten, dan konsisten upload.
    </p>

    <div class="stats">
      <div class="stat">
        <strong>1K+</strong>
        <small>Supporter</small>
      </div>
      <div class="stat">
        <strong>24/7</strong>
        <small>Active</small>
      </div>
      <div class="stat">
        <strong>Secure</strong>
        <small>Payment</small>
      </div>
    </div>

    <div class="actions">
      <button class="btn-support">💙 Support</button>
      <a class="btn-follow" href="#">👤 Follow WA</a>
    </div>
<footer class="footer">
  © Copyright 2020-2025 Farin Official
</footer>
  </section>
</main>

<script src="index.js"></script>
</body>
</html>
