<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support Farin Yt</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  background:
    radial-gradient(800px circle at top left, #1a1144, transparent 40%),
    radial-gradient(800px circle at bottom right, #003f44, transparent 45%),
    #06070c;
  color: #f1f1f6;
}

.container {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.content {
  width: 100%;
  max-width: 420px;
}

.badge {
  display: inline-block;
  padding: 6px 14px;
  font-size: 11px;
  letter-spacing: 1px;
  border-radius: 999px;
  background: rgba(255,255,255,0.08);
  margin-bottom: 18px;
}

h1 {
  font-size: 34px;
  margin-bottom: 10px;
}

h1 span {
  color: #5fd6ff;
}

.subtitle {
  font-size: 14.5px;
  line-height: 1.6;
  color: #c9cbe0;
  margin-bottom: 22px;
}

.input-box {
  margin-bottom: 22px;
}

.input-box label {
  font-size: 13px;
  color: #aeb1d6;
}

.input-box input {
  width: 100%;
  margin-top: 8px;
  height: 52px;
  padding: 0 16px;
  border-radius: 14px;
  border: none;
  outline: none;
  font-size: 15px;
  background: rgba(255,255,255,0.08);
  color: #fff;
}

.methods {
  display: grid;
  gap: 14px;
}

.method {
  width: 100%;
  height: 56px;
  border-radius: 16px;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  font-weight: 600;
}

.method:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.qris {
  background: linear-gradient(90deg, #5b7cff, #6ddcff);
  color: #0c1020;
}

.dana {
  background: #ffffff;
}

.dana img {
  height: 22px;
}

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  backdrop-filter: blur(6px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 10;
}

.card {
  background: #0b0f1f;
  border-radius: 20px;
  padding: 24px;
  width: 90%;
  max-width: 320px;
  text-align: center;
}

.card img {
  width: 100%;
  border-radius: 12px;
  margin-bottom: 16px;
}

.card button {
  width: 100%;
  height: 46px;
  border-radius: 999px;
  border: none;
  font-weight: 600;
}

.primary {
  background: linear-gradient(90deg, #5b7cff, #6ddcff);
  margin-bottom: 10px;
}

.secondary {
  background: transparent;
  border: 1px solid rgba(255,255,255,.25);
  color: #fff;
}

footer {
  position: fixed;
  bottom: 14px;
  width: 100%;
  text-align: center;
  font-size: 12px;
  color: rgba(255,255,255,.5);
}

.card p {
  margin-bottom: 14px;
}

.card strong {
  font-size: 16px;
  letter-spacing: .5px;
}

.card img {
  margin-top: 6px;
  margin-bottom: 18px;
}

#danaBox .card p:first-child {
  font-weight: 600;
  letter-spacing: 1px;
  margin-bottom: 12px;
}

#danaBox strong {
  font-size: 18px;
}

#danaBox small {
  color: #b8bce7;
}
</style>
</head>

<body>

<div class="container">
  <div class="content">

    <span class="badge">SECURE DONATION</span>

    <h1>Support <span>Farin Yt</span></h1>
    <p class="subtitle">
      Masukkan nominal dukungan kamu lalu pilih metode pembayaran.
    </p>

    <div class="input-box">
      <label>Nominal (Rp)</label>
      <input type="text" id="nominal" placeholder="3.000" inputmode="numeric">
    </div>

    <div class="methods">
      <button class="method qris" id="btnQris" disabled onclick="showQRIS()"><strong>QRIS ALL PAYMENT</strong></button>
      <button class="method dana" id="btnDana" disabled onclick="showDana()">
        <img src="https://upload.wikimedia.org/wikipedia/commons/5/52/Dana_logo.png">
      </button>
    </div>

  </div>
</div>

<div class="overlay" id="qrisBox">
  <div class="card">
  <p>
      <strong>QRIS ALL PAYMENT</strong>
    </p>
    <img src="qris.png">
     <button class="primary" onclick="downloadQRIS()">
      <strong>Download QRIS</strong>
    </button>
    <button class="secondary" onclick="closeQRIS()">
      <strong>Tutup</strong>
    </button>
  </div>
</div>

<div class="overlay" id="danaBox">
  <div class="card">
    <p> <strong>TRANSFER DANA</strong></p>
    <p>
      0831 6398 5132<br>
      <small>a.n. Ahmad F***l F******d</small>
    </p>
    <button class="primary" onclick="openDana()"><strong>Masuk ke DANA</strong></button>
    <button class="secondary" onclick="closeDana()"><strong>Batal</strong></button>
  </div>
</div>

<footer>© Copyright 2020-2025 Farin Official</footer>

<script>
const btnQris = document.getElementById("btnQris");
const btnDana = document.getElementById("btnDana");
const nominalInput = document.getElementById("nominal");

nominalInput.addEventListener("input", () => {
  let value = nominalInput.value.replace(/\D/g, "");
  if (!value) {
    nominalInput.value = "";
    btnQris.disabled = true;
    btnDana.disabled = true;
    return;
  }

  const number = parseInt(value);
  nominalInput.value = new Intl.NumberFormat("id-ID").format(number);

  if (number >= 3000) {
    btnQris.disabled = false;
    btnDana.disabled = false;
  } else {
    btnQris.disabled = true;
    btnDana.disabled = true;
  }
});



function getNominal() {
  const raw = nominalInput.value.replace(/\D/g, "");
  const n = parseInt(raw);

  if (!n) {
    alert("Masukkan nominal dulu");
    return false;
  }

  if (n < 3000) {
    alert("Minimal donasi Rp3.000");
    return false;
  }

  return n;
}

function showQRIS() {
  if (!getNominal()) return;
  document.getElementById("qrisBox").style.display = "flex";
}

function showDana() {
  if (!getNominal()) return;
  document.getElementById("danaBox").style.display = "flex";
}

function closeQRIS() {
  document.getElementById("qrisBox").style.display = "none";
}

function closeDana() {
  document.getElementById("danaBox").style.display = "none";
}

function openDana() {
  window.location.href = "dana://transfer";
}

function downloadQRIS() {
  const img = document.getElementById("qrisImage");
  const link = document.createElement("a");

  link.href = img.src;
  link.download = "QRIS-Farin-YT.png";
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}
</script>
</body>
</html>
